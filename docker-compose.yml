services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:3000
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-appadmin}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB: assinatura_despesas
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-AssinaDespesas <no-reply@example.com>}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-appadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Configure MONGO_ROOT_PASSWORD no arquivo .env}
      MONGO_INITDB_DATABASE: assinatura_despesas
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo_data:
  uploads:
